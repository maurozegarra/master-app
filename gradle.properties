# Compilar rapido (14-oct-2026): esta PC tiene 16 GB y 16 hilos. Antes iba con 1 GB, GC serial
# y 2 workers, mas --no-daemon en los scripts: cada build arrancaba la JVM en frio.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# JBR de Android Studio de esta PC (JDK 21, coincide con toolchainVersion).
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
